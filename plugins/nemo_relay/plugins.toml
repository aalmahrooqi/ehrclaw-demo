version = 1

[[components]]
kind = "observability"
enabled = true

[components.config]
version = 2

[components.config.atof]
enabled = true

[[components.config.atof.sinks]]
type = "file"
output_directory = "/sandbox/.nemo-relay/atof"


[components.config.atif]
enabled = true
output_directory = "/sandbox/.nemo-relay/atif"

[[components]]
kind = "pii_redaction"
enabled = true

[components.config]
version = 1
codec = "openai_chat"

[[components.config.profiles]]
mode = "builtin"

[components.config.profiles.builtin]
action = "mask"
pattern = '\b(?:(?:19|20)\d{2}[-/.](?:0?[1-9]|1[0-2])[-/.](?:0?[1-9]|[12]\d|3[01])|(?:(?:0?[1-9]|1[0-2])[-/.](?:0?[1-9]|[12]\d|3[01])|(?:0?[1-9]|[12]\d|3[01])[-/.](?:0?[1-9]|1[0-2]))[-/.](?:19|20)\d{2})\b'

# Managed (adaptive) tool/LLM execution is disabled: the relay plugin bridges
# its async managed path from a sync middleware hook by running each call in a
# new thread with a new event loop, so tools whose awaitables belong to Hermes's
# main loop fail with "got Future <...> attached to a different loop" — hitting
# skill_view and vision_analyze mid-turn. With this off, the middleware calls
# tools directly and the pre/post hooks still emit the same tool and LLM spans.
[[components]]
kind = "adaptive"
enabled = false

[components.config.tool_parallelism]
mode = "observe_only"