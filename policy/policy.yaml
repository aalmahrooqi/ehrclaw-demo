version: 1
filesystem_policy:
  include_workdir: true
  read_only:
  - /usr
  - /lib
  - /opt/hermes
  - /proc
  - /dev/urandom
  - /app
  - /etc
  - /var/log
  read_write:
  - /sandbox
  - /tmp
  - /dev/null
  - /dev/pts
  - /sandbox/.hermes
  - /opt/hermes/.venv
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  allow_api_fda_gov_443:
    name: allow_api_fda_gov_443
    endpoints:
    - host: api.fda.gov
      port: 443
    binaries:
    - path: /opt/venv/bin/python3
    - path: /usr/bin/curl
  allow_fhir_server_access:
    name: allow_fhir_server_access
    endpoints:
    - host: host.openshell.internal
      port: 8081
      protocol: rest
      access: read-write
      allowed_ips:
      - '172.18.0.1/32'
    binaries:
    - path: /usr/bin/curl
  allow_nv_reason_cxr_space_443:
    name: allow_nv_reason_cxr_space_443
    endpoints:
    - host: nvidia-nv-reason-cxr.hf.space
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: GET
          path: /**
      - allow:
          method: POST
          path: /gradio_api/upload
      - allow:
          method: POST
          path: /gradio_api/queue/join
    binaries:
    - path: /usr/bin/python3*
    - path: /usr/local/bin/python3
    - path: /opt/venv/bin/python3
    - path: /opt/hermes/.venv/bin/python
  allow_rxnav_nlm_nih_gov_443:
    name: allow_rxnav_nlm_nih_gov_443
    endpoints:
    - host: rxnav.nlm.nih.gov
      port: 443
    binaries:
    - path: /usr/bin/curl
  brew:
    name: brew
    endpoints:
    - host: formulae.brew.sh
      port: 443
      tls: skip
      access: full
    - host: github.com
      port: 443
      tls: skip
      access: full
    - host: ghcr.io
      port: 443
      tls: skip
      access: full
    - host: pkg-containers.githubusercontent.com
      port: 443
      tls: skip
      access: full
    - host: objects.githubusercontent.com
      port: 443
      tls: skip
      access: full
    - host: raw.githubusercontent.com
      port: 443
      tls: skip
      access: full
    binaries:
    - path: /usr/bin/curl
    - path: /usr/bin/git
    - path: /usr/local/bin/brew
    - path: /home/linuxbrew/.linuxbrew/bin/brew
    - path: /home/linuxbrew/.linuxbrew/bin/*
    - path: /home/linuxbrew/.linuxbrew/Homebrew/bin/*
  huggingface:
    name: huggingface
    endpoints:
    - host: huggingface.co
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: GET
          path: /**
    - host: cdn-lfs.huggingface.co
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: GET
          path: /**
    - host: router.huggingface.co
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: GET
          path: /**
      - allow:
          method: POST
          path: /**
    binaries:
    - path: /usr/local/bin/python3
    - path: /usr/local/bin/node
  managed_inference:
    name: managed_inference
    endpoints:
    - host: inference.local
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: POST
          path: /v1/chat/completions
      - allow:
          method: POST
          path: /v1/messages
      - allow:
          method: POST
          path: /v1/responses
      - allow:
          method: POST
          path: /v1/completions
      - allow:
          method: POST
          path: /v1/embeddings
      - allow:
          method: GET
          path: /v1/models
      - allow:
          method: GET
          path: /v1/models/**
    binaries:
    - path: /usr/local/bin/hermes
    - path: /usr/bin/python3.11
    - path: /opt/hermes/.venv/bin/python
  nous_research:
    name: nous_research
    endpoints:
    - host: nousresearch.com
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: GET
          path: /**
      - allow:
          method: POST
          path: /**
    - host: hermes-agent.nousresearch.com
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: GET
          path: /**
      - allow:
          method: POST
          path: /**
    binaries:
    - path: /usr/local/bin/hermes
    - path: /usr/bin/python3*
    - path: /opt/hermes/.venv/bin/python
  npm_yarn:
    name: npm_yarn
    endpoints:
    - host: registry.npmjs.org
      port: 443
      tls: skip
      access: full
    - host: registry.yarnpkg.com
      port: 443
      tls: skip
      access: full
    binaries:
    - path: /usr/local/bin/npm*
    - path: /usr/local/bin/npx*
    - path: /usr/local/bin/node*
    - path: /usr/local/bin/yarn*
    - path: /usr/bin/npm*
    - path: /usr/bin/node*
  nvidia:
    name: nvidia
    endpoints:
    - host: integrate.api.nvidia.com
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: POST
          path: /v1/chat/completions
      - allow:
          method: POST
          path: /v1/completions
      - allow:
          method: POST
          path: /v1/embeddings
      - allow:
          method: GET
          path: /v1/models
      - allow:
          method: GET
          path: /v1/models/**
    binaries:
    - path: /usr/local/bin/hermes
    - path: /usr/bin/python3*
    - path: /opt/hermes/.venv/bin/python
  pypi:
    name: pypi
    endpoints:
    - host: pypi.org
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: GET
          path: /**
    - host: files.pythonhosted.org
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: GET
          path: /**
    binaries:
    - path: /usr/bin/curl
    - path: /usr/local/bin/pip3
    - path: /usr/local/bin/curl
    - path: /usr/bin/python3*
    - path: /opt/hermes/.venv/bin/python
    - path: /usr/local/bin/uv
  weather:
    name: weather
    endpoints:
    - host: api.open-meteo.com
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: GET
          path: /v1/forecast
      - allow:
          method: HEAD
          path: /v1/forecast
      - allow:
          method: GET
          path: /v1/elevation
      - allow:
          method: HEAD
          path: /v1/elevation
    - host: geocoding-api.open-meteo.com
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: GET
          path: /v1/search
      - allow:
          method: HEAD
          path: /v1/search
      - allow:
          method: GET
          path: /v1/get
      - allow:
          method: HEAD
          path: /v1/get
    - host: api.weather.gov
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: GET
          path: /points/**
      - allow:
          method: HEAD
          path: /points/**
      - allow:
          method: GET
          path: /gridpoints/**
      - allow:
          method: HEAD
          path: /gridpoints/**
      - allow:
          method: GET
          path: /alerts
      - allow:
          method: HEAD
          path: /alerts
      - allow:
          method: GET
          path: /alerts/**
      - allow:
          method: HEAD
          path: /alerts/**
      - allow:
          method: GET
          path: /stations
      - allow:
          method: HEAD
          path: /stations
      - allow:
          method: GET
          path: /stations/**
      - allow:
          method: HEAD
          path: /stations/**
      - allow:
          method: GET
          path: /zones
      - allow:
          method: HEAD
          path: /zones
      - allow:
          method: GET
          path: /zones/**
      - allow:
          method: HEAD
          path: /zones/**
      - allow:
          method: GET
          path: /offices
      - allow:
          method: HEAD
          path: /offices
      - allow:
          method: GET
          path: /offices/**
      - allow:
          method: HEAD
          path: /offices/**
      - allow:
          method: GET
          path: /products
      - allow:
          method: HEAD
          path: /products
      - allow:
          method: GET
          path: /products/**
      - allow:
          method: HEAD
          path: /products/**
      - allow:
          method: GET
          path: /openapi.json
      - allow:
          method: HEAD
          path: /openapi.json
      - allow:
          method: GET
          path: /openapi.yaml
      - allow:
          method: HEAD
          path: /openapi.yaml
    binaries:
    - path: /usr/local/bin/openclaw
    - path: /usr/local/bin/node
    - path: /usr/bin/node
    - path: /usr/local/bin/hermes
    - path: /opt/hermes/.venv/bin/python
    - path: /usr/bin/python3
    - path: /usr/bin/python3.11
    - path: /usr/bin/curl
    - path: /usr/local/bin/curl
